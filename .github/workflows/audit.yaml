name: Audit

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # monday 07:00 utc, catches advisories published while the repo is idle
    - cron: '0 7 * * 1'
  workflow_dispatch:

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          # CPU wheel first: the default Linux torch wheel bundles CUDA and is ~2GB.
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -r requirements.txt
          pip install -r requirements-dev.txt
          pip install pip-audit

      # audits the resolved environment, so transitives of the pinned packages are covered too
      - name: pip-audit
        run: pip-audit --strict
