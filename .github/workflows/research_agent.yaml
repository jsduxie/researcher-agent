name: Daily Research Digest

on:
  schedule:
    - cron: '0 8 * * *'
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  # sentence-transformers reads the model from the huggingface hub cache layout; the cache is seeded from this repo's model-cache release, never from HuggingFace (runner IPs get hard 429s there).
  HF_HOME: /home/runner/.cache/huggingface
  HF_HUB_OFFLINE: '1'

jobs:
  test:
    runs-on: ubuntu-latest
    # Normal runs finish in ~10m; a stalled runner once sat in_progress for 5.5h and would have blocked send-digest (needs: test) on a schedule trigger.
    timeout-minutes: 30
    # Every test run shares one Neon test branch, so serialise them; concurrent integration suites truncate each other's data mid-run.
    concurrency:
      group: researcher-agent-neon-test-db
      cancel-in-progress: false
    # Job-level env so the integration step can gate per-secret. Fork PRs receive '' for missing secrets, which would otherwise fail db.connect('') or live Gemini calls.
    env:
      DATABASE_URL_TEST: ${{ secrets.DATABASE_URL_TEST }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Restore embedding model cache
        id: model-cache
        uses: actions/cache/restore@v4
        with:
          path: /home/runner/.cache/huggingface
          key: hf-all-MiniLM-L6-v2-v2

      - name: Install dependencies
        run: |
          # CPU wheel first: the default Linux torch wheel bundles CUDA and is ~2GB.
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -r requirements.txt
          pip install -r requirements-dev.txt

      - name: Fetch embedding model from the model-cache release
        if: steps.model-cache.outputs.cache-hit != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p "$HF_HOME"
          gh release download model-cache-v1 --repo ${{ github.repository }} --pattern 'all-MiniLM-L6-v2-hf-cache.tar.gz' --output - | tar -xz -C "$HF_HOME"

      - name: Save embedding model cache
        if: steps.model-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: /home/runner/.cache/huggingface
          key: hf-all-MiniLM-L6-v2-v2

      - name: Lint
        run: |
          ruff check .
          ruff format --check .

      - name: Unit tests
        run: pytest -m 'not integration' --cov --cov-branch --cov-report=term --junitxml=junit-unit.xml

      - name: Integration tests
        if: always() && (env.DATABASE_URL_TEST != '' || env.GEMINI_API_KEY != '')
        run: pytest -m integration --cov-append --cov-branch --cov-report=term --junitxml=junit-integration.xml

      - name: Coverage reports
        if: always()
        run: |
          coverage xml -o coverage.xml
          coverage json -o coverage.json

      - name: Total coverage gate
        if: always()
        run: coverage report --fail-under=95

      - name: Per-module coverage gate
        if: always()
        run: python scripts/check_coverage.py

      - name: Upload coverage to Codecov
        if: always()
        uses: codecov/codecov-action@v4
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: coverage.xml
          fail_ci_if_error: false

      - name: Upload test results to Codecov
        if: ${{ !cancelled() }}
        uses: codecov/test-results-action@v1
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: junit-unit.xml,junit-integration.xml

  send-digest:
    needs: test
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Restore embedding model cache
        id: model-cache
        uses: actions/cache/restore@v4
        with:
          path: /home/runner/.cache/huggingface
          key: hf-all-MiniLM-L6-v2-v2

      - name: Install dependencies
        run: |
          # CPU wheel first: the default Linux torch wheel bundles CUDA and is ~2GB.
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -r requirements.txt

      - name: Fetch embedding model from the model-cache release
        if: steps.model-cache.outputs.cache-hit != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p "$HF_HOME"
          gh release download model-cache-v1 --repo ${{ github.repository }} --pattern 'all-MiniLM-L6-v2-hf-cache.tar.gz' --output - | tar -xz -C "$HF_HOME"

      - name: Save embedding model cache
        if: steps.model-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: /home/runner/.cache/huggingface
          key: hf-all-MiniLM-L6-v2-v2

      - name: Run research agent
        env:
          # Flush stdout/stderr per write so cron output surfaces in real time.
          PYTHONUNBUFFERED: '1'
          SEMANTIC_SCHOLAR_API_KEY: ${{ secrets.SEMANTIC_SCHOLAR_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: python main.py
