name: Daily Research Digest

on:
  schedule:
    - cron: '0 8 * * *'
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    # Job-level env so the integration step can gate per-secret. Fork PRs receive '' for missing secrets, which would otherwise fail db.connect('') or live Gemini calls.
    env:
      DATABASE_URL_TEST: ${{ secrets.DATABASE_URL_TEST }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install -r requirements-dev.txt

      - name: Lint
        run: |
          ruff check .
          ruff format --check .

      - name: Unit tests
        run: pytest -m 'not integration' --cov --cov-branch --cov-report=term --junitxml=junit-unit.xml

      - name: Integration tests
        if: always() && (env.DATABASE_URL_TEST != '' || env.GEMINI_API_KEY != '')
        env:
          # PR pushes opt into the long-idle test; push-to-main and the scheduled cron skip it so the post-merge / daily CI stays fast.
          RUN_LONG_INTEGRATION: ${{ github.event_name == 'pull_request' && '1' || '0' }}
        run: pytest -m integration --cov-append --cov-branch --cov-report=term --junitxml=junit-integration.xml

      - name: Coverage reports
        if: always()
        run: |
          coverage xml -o coverage.xml
          coverage json -o coverage.json

      - name: Total coverage gate
        if: always()
        run: coverage report --fail-under=95

      - name: Per-module coverage gate
        if: always()
        run: python scripts/check_coverage.py

      - name: Upload coverage to Codecov
        if: always()
        uses: codecov/codecov-action@v4
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: coverage.xml
          fail_ci_if_error: false

      - name: Upload test results to Codecov
        if: ${{ !cancelled() }}
        uses: codecov/test-results-action@v1
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: junit-unit.xml,junit-integration.xml

  send-digest:
    needs: test
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run research agent
        env:
          # Flush stdout/stderr per write so cron output surfaces in real time.
          PYTHONUNBUFFERED: '1'
          SEMANTIC_SCHOLAR_API_KEY: ${{ secrets.SEMANTIC_SCHOLAR_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: python main.py
