[project]
name = 'researcher-agent'
version = '0.1.0'
description = 'Daily research digest for BPD detection and mental health NLP'
requires-python = '>=3.11'

[tool.ruff]
line-length = 120
target-version = 'py311'

[tool.ruff.format]
quote-style = 'single'
indent-style = 'tab'
line-ending = 'lf'
skip-magic-trailing-comma = true

[tool.ruff.lint]
select = ['E', 'W', 'F', 'I', 'UP', 'B', 'SIM', 'PLR']
ignore = ['E501', 'PLR2004', 'W191']

[tool.ruff.lint.isort]
split-on-trailing-comma = false

[tool.ruff.lint.pylint]
max-args = 5

[tool.pytest.ini_options]
pythonpath = ['.']
testpaths = ['tests']
markers = ['integration: tests that require a live Postgres connection via DATABASE_URL_TEST']
